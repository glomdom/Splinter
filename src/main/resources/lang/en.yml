addon: Splinter

item:
  reader:
    name: "Reader"
    lore: |-
      <arrow> Reads a configurable state from a block
      <arrow> Must be linked to a receiver to send data

  linker_tool:
    name: "Linker"
    lore: |-
      <arrow> Links a reader to a receiver

  receiver:
    name: "Receiver"
    lore: |-
      <arrow> The brains of a logistic network
      <arrow> Receives data from one or more readers

  probe:
    name: "Probe"
    lore: |-
      <arrow> Outputs the amount of the provided item from a receiver

  data_wire:
    name: "Data Wire"
    lore: |-
      <arrow> Kompooter, send ones and zeroes

  redstone_out:
    name: "Redstone Out"
    lore: |-
      <arrow> Outputs a redstone signal based on the input data

  constant:
    name: "Constant"
    lore: |-
      <arrow> Outputs a constant value to every side
      <arrow> <insn>Shift right click</insn> to change the constant

reader:
  status:
    unlinked: "Status: <yellow>Unlinked</yellow>"
    transmitting: "Status: <green>Transmitting</green>"
  subject:
    item: "Subject: <aqua>%subject%</aqua>"
    invalid: "Subject: <red>Invalid</red>"

receiver:
  status:
    unlinked: "Status: <yellow>Unlinked</yellow>"
    receiving: "Status: <green>Receiving</green>"
    error: "Status: <red>Error</red."

probe:
  status:
    unlinked: "Status: <yellow>Unlinked</yellow>"
    receiving: "Status: <green>Receiving</green>"
  filter:
    none: "Filter: <red>None</red>"
    item: "Filter: <aqua>%item%</aqua>"

constant:
  value: "Constant: <aqua>%value%</aqua>"

messages:
  linker:
    started_linking: "Started linking <green>%what%</green> <aqua>%x%, %y%, %z%</aqua>"
    stopped_linking: "Stopped linking"
    already_linking: "Already linking <green>%what%</green> at <aqua>%x%, %y%, %z%</aqua>, <insn>Shift right click</insn> in the air to stop linking"

    linked: "Linked <green>%source%</green> to <green>%target%</green> at <aqua>%x%, %y%, %z%</aqua>"
    unlinked: "Unlinked <green>%source%</green> from <green>%target%</green>"

    incompatible: "<red>Those two blocks can't be linked</red>"
    invalid: "<red>This block cannot be linked</red>"
    same_block: "<red>Can't link a block to itself</red>"
    different_world: "<red>Both blocks must be in the same world</red>"
    source_busy: "<red>%source% is already linked</red>"
    capacity_full: "<red>%target% is full</red> (<aqua>%limit%</aqua> readers max)"
    too_far: "<red>Too far</red> - <aqua>%distance%</aqua> blocks, range is <aqua>%range%</aqua>"

  constant:
    invalid: "Invalid constant provided"
    ok: "Successfully set constant"

gui:
