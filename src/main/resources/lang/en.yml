addon: Splinter

item:
  reader:
    name: "Reader"
    lore: |-
      <arrow> Reads a configurable state from a block.
      <arrow> Must be linked to a receiver to send data.

  linker_tool:
    name: "Linker"
    lore: |-
      <arrow> Links a reader to a receiver.

  receiver:
    name: "Receiver"
    lore: |-
      <arrow> Receives data from one or more readers.

reader:
  status:
    label: "Status: %status%"
    unconfigured: "<red>Unconfigured</red>"
    unlinked: "<yellow>Unlinked</yellow>"
    transmitting: "<green>Transmitting</green>"
  subject:
    label: "Subject: %subject%"
    invalid: "<red>Invalid</red>"
    chest: "<gold>Chest</gold>"
  config:
    label: "Config: %config%"
    none: "<red>None</red>"
    count: "<aqua>Count</aqua>"
  gui:
    config:
      name: "<white>Configuration"
      current: "<gray>Current: %config%"
      hint: "<insn>Click to cycle"

receiver:
  status:
    label: "Status: %status%"
    unlinked: "<yellow>Unlinked</yellow>"
    receiving: "<green>Receiving</green>"
    error: "<red>Error</red>"
  config:
    label: "Config: %config%"
    sum: "<green>Sum</green>"
    min: "<aqua>Min</aqua>"
    max: "<blue>Max</blue>"
  gui:
    config:
      name: "<white>Configuration"
      current: "<gray>Current: %config%"
      hint: "<insn>Click to cycle"

messages:
  linker:
    started_linking: "Started linking <green>%what%</green> <aqua>%x%, %y%, %z%</aqua>"
    stopped_linking: "Stopped linking"
    already_linking: "Already linking <green>%what%</green> at <aqua>%x%, %y%, %z%</aqua>, <insn>Shift Right Click</insn> in the air to stop linking"

    linked: "Linked <green>%source%</green> to <green>%target%</green> at <aqua>%x%, %y%, %z%</aqua>"
    unlinked: "Unlinked <green>%source%</green> from <green>%target%</green>"

    incompatible: "<red>Those two blocks can't be linked</red>"
    same_block: "<red>Can't link a block to itself</red>"
    different_world: "<red>Both blocks must be in the same world</red>"
    source_busy: "<red>%source% is already linked</red>"
    capacity_full: "<red>%target% is full</red> (<aqua>%limit%</aqua> readers max)"
    too_far: "<red>Too far</red> — <aqua>%distance%</aqua> blocks, range is <aqua>%range%</aqua>"

guide:
  page:
    help: "Splinter Help"
    splinter: "Splinter"

unit:
  reader:
    singular: "reader"
    plural: "readers"