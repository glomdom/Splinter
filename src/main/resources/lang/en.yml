addon: Splinter

item:
  reader:
    name: "Reader"
    lore: |-
      <arrow> Reads a configurable state from a block
      <arrow> Must be linked to a receiver to send data

  linker_tool:
    name: "Linker"
    lore: |-
      <arrow> Links a reader to a receiver

  receiver:
    name: "Receiver"
    lore: |-
      <arrow> The brains of a logistic network
      <arrow> Receives data from one or more readers

  probe:
    name: "Probe"
    lore: |-
      <arrow> Outputs the amount of the provided item from a receiver

  data_wire:
    name: "Data Wire"
    lore: |-
      <arrow> Kompooter, send ones and zeroes

  redstone_out:
    name: "Redstone Out"
    lore: |-
      <arrow> Outputs a redstone signal based on the input data

  constant:
    name: "Constant"
    lore: |-
      <arrow> Outputs a constant value to every side
      <arrow> <insn>Shift right click</insn> to change the constant

  boolean_comparer:
    name: "Boolean Comparer"
    lore: |-
      <arrow> Compares A with B
      <arrow> <insn>Shift right click</insn> to change the operation
      <arrow> A is the input from the <aqua>Blue</aqua> port
      <arrow> B is the input from the <red>Red</red> port

  spiller:
    name: "Spiller"
    lore: |-
      <arrow> Spills provided items into the attached inventory

