addon: Splinter

item:
  linker_tool:
    name: "Linker"
    lore: |-
      <arrow> Links readers, probes and spillers to a receiver
      <arrow> <insn>Right click</insn> a block to start, then the receiver to finish
      <arrow> <insn>Shift right click</insn> in the air to cancel

  reader:
    name: "Reader"
    lore: |-
      <arrow> Reports the contents of the inventory it faces
      <arrow> Must be linked to a receiver

  receiver:
    name: "Receiver"
    lore: |-
      <arrow> The brain of a logistics network
      <arrow> Collects the contents of every linked reader

  probe:
    name: "Probe"
    lore: |-
      <arrow> Outputs how many of the filtered item the network holds
      <arrow> Must be linked to a receiver

  spiller:
    name: "Spiller"
    lore: |-
      <arrow> Keeps the inventory it faces stocked with the filtered item
      <arrow> Input: how many to <aqua>keep</aqua>
      <arrow> Output: <aqua>1</aqua> once the target is stocked

  data_wire:
    name: "Data Wire"
    lore: |-
      <arrow> Carries a number from one port to another
      <arrow> Kompooter, send ones and zeroes

  constant:
    name: "Constant"
    lore: |-
      <arrow> Outputs a fixed number on every side
      <arrow> <insn>Shift right click</insn> to change it

  boolean_comparer:
    name: "Boolean Comparer"
    lore: |-
      <arrow> Outputs <aqua>1</aqua> when A and B compare true, otherwise <aqua>0</aqua>
      <arrow> A is the <blue>blue</blue> port, B is the <red>red</red> port
      <arrow> <insn>Shift right click</insn> with an empty hand to change the operation

  redstone_out:
    name: "Redstone Out"
    lore: |-
      <arrow> Emits a redstone signal equal to its input, from <aqua>0</aqua> to <aqua>15</aqua>

  arithmetic:
    name: "Arithmetic"
    lore: |-
      <arrow> Outputs the result of the arithmetic done on A and B
      <arrow> A is the <blue>blue</blue> port, B is the <red>red</red> port
      <arrow> <insn>Shift right click</insn> with an empty hand to change the operation

