    name: "Filter"
    current:
      item: "<star> Current: <aqua>%name%</aqua>"
      none: "<star> Current: <red>None</red>"
    hint: "<arrow> <insn>Left click</insn> while holding an item to change the filter<br><arrow> <insn>Shift left click</insn> to clear"

